[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "paperless-ngx-mistral-ocr"
version = "0.1.1"
description = "Paperless-ngx parser plugin that OCRs PDFs and images with Mistral Document AI"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Martin Clemons" }]
dependencies = [
  "httpx>=0.27",
  "pymupdf>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[project.urls]
Homepage = "https://github.com/martin-c/paperless-ngx-mistral-ocr"
Issues = "https://github.com/martin-c/paperless-ngx-mistral-ocr/issues"

[project.entry-points."paperless_ngx.parsers"]
mistral_ocr = "paperless_mistral_ocr.parser:MistralOcrParser"

[tool.hatch.build.targets.wheel]
packages = ["src/paperless_mistral_ocr"]

[tool.hatch.build.targets.sdist]
include = ["src/paperless_mistral_ocr", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "D", "SIM"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["paperless_mistral_ocr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: tests that call the Mistral API (skipped unless MISTRAL_LIVE_TESTS=1)"]
filterwarnings = [
  "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]
